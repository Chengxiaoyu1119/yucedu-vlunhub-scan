name: Cross-platform checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Check Python syntax
        run: python -B -m compileall -q scanner_app tests

      - name: Run platform tests
        run: python -B -m unittest -v tests.test_platform_support

      - name: Check project structure
        run: python -B -m unittest -v tests.test_project_structure

      - name: Run screenshot runtime test
        run: python -B -m unittest -v tests.test_screenshot

      - name: Run GUI chart tests
        run: python -B -m tests.test_charts

      - name: Run report chart tests
        run: python -B -m tests.test_report_charts

      - name: Build lean Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1
          $exe = Get-Item .artifacts\dist\靶场扫描助手.exe
          if ($exe.Length -gt 80MB) {
            throw "精简版 EXE 超过 80 MB：$([math]::Round($exe.Length / 1MB, 1)) MB"
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          if (-not $icon) { throw "EXE 未嵌入有效应用图标" }
          $icon.Dispose()
          $icoBytes = [System.IO.File]::ReadAllBytes(".artifacts\build\靶场扫描助手.ico")
          $frameCount = [System.BitConverter]::ToUInt16($icoBytes, 4)
          if ($frameCount -lt 7) { throw "Windows ICO 未包含完整多尺寸图标帧：$frameCount" }
          $browser = Get-ChildItem .artifacts\dist\playwright-browsers -Recurse -Filter chrome.exe -File |
            Select-Object -First 1
          if (-not $browser) { throw "发行目录没有完整 Chromium：.artifacts\dist\playwright-browsers" }
          if ($browser.Length -lt 10MB) { throw "Chromium 主程序体积异常：$($browser.Length) bytes" }

      - name: Check macOS launcher
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash -n "launchers/启动靶场扫描.command"
          test -x "launchers/启动靶场扫描.command"

      - name: Smoke test macOS launcher
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./launchers/启动靶场扫描.command
          sleep 5
          gui_pid="$(ps -axo pid=,command= | awk '/scanner_app\.desktop\.gui/ {print $1; exit}')"
          if [ -z "$gui_pid" ]; then
            echo "scanner_app.desktop.gui did not remain running after launcher start"
            exit 1
          fi
          kill "$gui_pid" || true
