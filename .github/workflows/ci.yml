name: Cross-platform checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Check Python syntax
        run: python -B -m compileall -q .

      - name: Run platform tests
        run: python -B -m unittest -v test_platform_support.py

      - name: Run GUI chart tests
        run: python -B test_charts.py

      - name: Run report chart tests
        run: python -B test_report_charts.py

      - name: Check macOS launcher
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash -n "启动靶场扫描.command"
          test -x "启动靶场扫描.command"
