name: Feature request
description: 提议一个清晰、可验证的功能改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前使用流程哪里不顺，影响谁？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的交互、输入、输出和平台差异。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 说明已经考虑过的替代方案或暂时的工作方式。
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议适用于本地靶场或安全教学场景。
          required: true
